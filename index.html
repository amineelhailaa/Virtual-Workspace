<section class=" hidden   left-0 top-0 w-full h-full bg-red-950/50 fixed " id="form_section">

    <form class="flex flex-col py-4 px-4 gap-y-2 bg-white border-1 border-amber-500 shadow-amber-600 rounded-2xl w-[90%] max-w-[400px]  absolute top-1/2 left-1/2  transform -translate-1/2 max- overflow-y-scroll max-h-[80vh]  "
          id="addForm">
        <label for="name">Nom</label>
        <div class="flex flex-col"><input class="outline-1 outline-amber-400 rounded-md px-4 py-1" id="name"
                                          type="text">
            <p class="text-red-500 text-xs  hidden" id="regFullName">Nom invalid!</p>
        </div>

        <label for="role">Role</label>
        <select class="outline-1 outline-amber-400 rounded-md px-4 py-1" id="role">
            <!--            ///fetch-->
            <option value="receptionist">Réceptionniste</option>
            <option value="technicien">Techniciens IT</option>
            <option value="manager">Manager</option>
            <option value="securite">Agents de sécurité</option>
            <option value="nettoyage">Nettoyage</option>
            <option value="other">Autres rôles</option>
        </select>


        <div class="flex items-center my-4 gap-5">
            <div class="rounded-full border-1 border-amber-400 aspect-square max-h-20 overflow-hidden  " id="profile">
                <img alt="profileImage" id="profileImage" src="./assets/emptyProfile.jpg"></div>
            <div class="flex flex-col grow min-w-0 ">
                <label for="inputProfile">Image</label>
                <input class="outline-1 outline-amber-400 rounded-md  px-2 py-1 " id="inputProfile" type="url">
                <p class="text-red-600 text-xs hidden" id="regImg">image url invalid!</p>
            </div>
        </div>


        <div>
            <div class=" flex flex-col gap-3 " id="experienceContainer">
                <label for="experienceContainer">Experiences Professionnelles</label>

            </div>
        </div>


        <button class=" bg-orange-400 rounded-md mt-4 text-white w-fit px-2 cursor-pointer py-1 self-center " id="btnExper"
                type="button">
            +Ajouter une experience
        </button>


        <label for="email">Email</label>
        <div class="flex flex-col"><input class="outline-1 outline-amber-400 rounded-md px-4 py-1" id="email"
                                          type="email">
            <p class="text-red-600 text-xs hidden" id="regEmail">image url invalid!</p></div>


        <label for="telephone">Telephone</label>
        <div class=" flex-col flex"><input class="outline-1 outline-amber-400 rounded-md px-4 py-1" id="telephone"
                                           type="tel">
            <p class="text-red-600 text-xs hidden" id="regPhone">phone number invalid!</p></div>

        <div class="flex justify-evenly flex-wrap">
            <button class=" bg-red-500 rounded-md mt-4 text-white px-4 cursor-pointer py-1  " id="btnAnnulerSubmit"
                    type="button">ANNULER
            </button>

            <button class=" bg-amber-600 rounded-md mt-4 text-white  px-4 cursor-pointer py-1 " id="btnSubmit"
                    type="submit">AJOUTER
            </button>
        </div>
    </form>
